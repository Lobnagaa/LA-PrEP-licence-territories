# Checks the data, runs the tests, builds the page and publishes it on GitHub Pages.
# A failing check stops the deploy, so the live site keeps its last good version.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Check the data and run the tests
        run: |
          node tools/check_data.js
          for t in tools/test_stage*.js; do node "$t"; done
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 tools/build.py
      - name: Assemble the site
        run: |
          mkdir _site
          cp dist/LAPaL_licence_coverage_prototype.html _site/index.html
          cp dist/lapal_licence_coverage.csv dist/robots.txt dist/sitemap.xml _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
